<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NerdGeek | Admin</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg-body: #09090b;
            --bg-panel: #18181b;
            --border: #27272a;
            --text: #e4e4e7;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            background-color: var(--bg-body);
            background-image: radial-gradient(#27272a 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            align-items: start;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 20px;
            max-height: 95vh;
            overflow-y: auto;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            margin-bottom: 20px;
            color: white;
        }

        h1 span {
            color: var(--primary);
        }

        h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #71717a;
            margin: 20px 0 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #a1a1aa;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: #27272a;
            border: 1px solid transparent;
            padding: 10px;
            border-radius: 6px;
            color: white;
            font-family: inherit;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
            background: #09090b;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-cancel {
            background: #3f3f46;
            color: #d4d4d8;
            margin-top: 10px;
            display: none;
        }

        /* --- ESTILOS NOVOS PARA ENQUETE DINÂMICA --- */
        .poll-row {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease;
        }

        .poll-row input {
            flex-grow: 1;
        }

        .btn-remove-opt {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            width: 40px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .btn-remove-opt:hover {
            background: #ef4444;
            color: white;
        }

        .btn-add-opt {
            background: rgba(139, 92, 246, 0.1);
            color: var(--primary);
            border: 1px dashed var(--primary);
            font-size: 0.8rem;
            padding: 8px;
            margin-top: 5px;
        }

        .btn-add-opt:hover {
            background: var(--primary);
            color: white;
        }

        /* --- ESTILO DA LISTA DE NOTÍCIAS --- */
        .news-item {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            align-items: center;
            gap: 15px;
            transition: background 0.2s, transform 0.2s;
            position: relative;
        }

        .sortable-ghost {
            opacity: 0.4;
            background: var(--primary);
        }

        .sortable-drag {
            cursor: grabbing;
            opacity: 1;
            background: #27272a;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .drag-handle {
            color: #555;
            cursor: grab;
            font-size: 1.5rem;
            padding: 0 5px;
            touch-action: none;
        }

        .thumb {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            background: #333;
            pointer-events: none;
            flex-shrink: 0;
        }

        .info {
            flex-grow: 1;
            min-width: 0;
        }

        .info strong {
            color: white;
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-cat {
            background: #27272a;
            color: #a1a1aa;
            border: 1px solid #3f3f46;
        }

        .badge-date {
            background: rgba(139, 92, 246, 0.1);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .badge-poll {
            background: rgba(6, 182, 212, 0.15);
            color: #67e8f9;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-edit {
            background: rgba(6, 182, 212, 0.1);
            color: #06b6d4;
        }

        .btn-del {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }

        ::-webkit-scrollbar-thumb {
            background-color: #3f3f46;
            border-radius: 5px;
            border: 2px solid var(--bg-body);
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: var(--primary);
        }

        .panel::-webkit-scrollbar-track {
            background: var(--bg-panel);
            margin: 10px;
            border-radius: 0 12px 12px 0;
        }

        .panel::-webkit-scrollbar-thumb {
            border-color: var(--bg-panel);
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--bg-body);
        }

        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #18181b;
            border-left: 4px solid var(--primary);
            color: white;
            padding: 15px 20px;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            font-size: 0.9rem;
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        /* --- RESPONSIVIDADE --- */
        @media(max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .panel {
                margin-bottom: 30px;
                position: static;
            }

            .news-item {
                display: grid;
                grid-template-columns: auto auto 1fr auto;
                gap: 12px;
                padding: 12px;
            }

            .drag-handle {
                font-size: 1.8rem;
                padding: 10px 5px;
            }

            .thumb {
                width: 60px;
                height: 60px;
            }

            .info strong {
                white-space: normal;
                font-size: 0.95rem;
                line-height: 1.3;
            }

            .actions {
                flex-direction: column;
                gap: 6px;
            }

            .icon-btn {
                width: 32px;
                height: 32px;
            }
        }

        @media(max-width: 450px) {
            .news-item {
                grid-template-columns: auto auto 1fr auto;
                gap: 10px;
                align-items: center;
            }

            .thumb {
                display: block !important;
                width: 45px;
                height: 45px;
                border-radius: 6px;
            }

            .drag-handle {
                font-size: 1.4rem;
                padding: 0;
            }

            .info strong {
                font-size: 0.85rem;
                margin-bottom: 4px;
            }

            .badge {
                padding: 2px 6px;
                font-size: 0.65rem;
            }

            .actions {
                gap: 4px;
            }

            .icon-btn {
                width: 30px;
                height: 30px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>
    <div id="toast-container"></div>
    <div class="layout">
        <aside class="panel">
            <h1 onclick="window.location.href='https://nerdgeek.netlify.app' " style="cursor: pointer;"
                title="Ir para o site">
                Admin <span>NerdGeek</span>
            </h1>
            <input type="hidden" id="editId">

            <h3>Conteúdo</h3>
            <div class="form-group"><label>Título</label><input type="text" id="title" placeholder="Manchete..."></div>
            <div class="form-group">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div><label>Categoria</label>
                        <select id="category">
                            <option value="games">Games</option>
                            <option value="marvel">Marvel</option>
                            <option value="dc">DC Comics</option>
                            <option value="filmes">Filmes</option>
                            <option value="series">Séries</option>
                        </select>
                    </div>
                    <div><label>Capa (URL)</label><input type="text" id="image" placeholder="http://..."></div>
                </div>
            </div>
            <div class="form-group"><label>Texto</label><textarea id="content" rows="6"
                    placeholder="Escreva a notícia aqui..."></textarea></div>

            <h3>Enquete (Opcional)</h3>
            <div
                style="background: rgba(139, 92, 246, 0.05); padding: 15px; border-radius: 8px; border: 1px dashed var(--primary);">
                <div class="form-group"><label>Pergunta</label><input type="text" id="pollQuestion" placeholder="Escreva a pergunta aqui..."></div>
                <div class="form-group">
                    <label>Opções</label>
                    <div id="pollOptionsContainer">
                    </div>
                    <button class="btn btn-add-opt" id="btnAddOption" onclick="addPollOption()">+ Adicionar
                        Opção</button>
                </div>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label>Extras</label>
                <input type="text" id="authorName" placeholder="Nome do Autor (ex: Kauan Bryan)"
                    style="margin-bottom:5px;">
                <input type="text" id="videoUrl" placeholder="Link YouTube ou Arquivo (ex: mp4)"
                    style="margin-bottom:5px;">
                <input type="text" id="sourceName" placeholder="Nome da Fonte (ex: Omelete)">
            </div>

            <button class="btn btn-primary" id="saveBtn">PUBLICAR NOTÍCIA</button>
            <button class="btn btn-cancel" id="cancelBtn">CANCELAR</button>
        </aside>

        <main class="main-list">
            <h2
                style="color: white; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
                <span>Publicações <span id="count" style="font-size: 0.8rem; opacity: 0.5;">(...)</span></span>
                <span style="font-size: 0.7rem; color: #666; font-weight: 400;">Segure e arraste p/ reordenar</span>
            </h2>
            <div id="list">
                <div style="text-align:center; padding:20px; color:#666;">Acessando banco de dados...</div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.21.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/9.21.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCCKb6EZKESQNIpE_CNKu3G7iaFS2Ini4",
            authDomain: "nerdgeek-b2bd4.firebaseapp.com",
            projectId: "nerdgeek-b2bd4",
            storageBucket: "nerdgeek-b2bd4.firebasestorage.app",
            messagingSenderId: "826389603208",
            appId: "1:826389603208:web:5e2e353ad79a54b97a503d",
            measurementId: "G-NBE1GRGFTT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const newsCollection = collection(db, "noticias");
        let sortableInstance = null;
        let currentEditingPoll = null; // Armazena estado da enquete ao editar para não perder votos

        // --- SISTEMA DE LISTAGEM ---
        onSnapshot(query(newsCollection, orderBy("orderId", "desc")), (snapshot) => {
            const list = document.getElementById('list');
            document.getElementById('count').innerText = `(${snapshot.size})`;
            list.innerHTML = '';

            let items = [];
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (!data.orderId) { updateDoc(doc(db, "noticias", docSnap.id), { orderId: data.dateParsed || Date.now() }); }
                items.push({ id: docSnap.id, ...data });
            });

            items.sort((a, b) => (b.orderId || 0) - (a.orderId || 0));

            if (items.length === 0) {
                list.innerHTML = `<div style="text-align:center; padding:40px; color:#555;">Nenhuma notícia encontrada.</div>`;
                return;
            }

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'news-item';
                div.dataset.id = item.id;

                const hasPoll = item.poll ? `<span class="badge badge-poll">📊 Enquete</span>` : '';

                div.innerHTML = `
                    <div class="drag-handle">⋮⋮</div>
                    <img src="${item.image}" class="thumb" onerror="this.src='https://placehold.co/70'">
                    <div class="info">
                        <strong>${item.title}</strong>
                        <div class="meta-badges">
                            <span class="badge badge-cat">${item.category}</span>
                            <span class="badge badge-date">📅 ${item.dateDisplay}</span>
                            ${hasPoll}
                        </div>
                    </div>
                    <div class="actions">
                        <button class="icon-btn btn-edit" title="Editar">✏️</button>
                        <button class="icon-btn btn-del" title="Excluir">🗑️</button>
                    </div>
                `;

                div.querySelector('.btn-edit').onclick = () => editItem(item);
                div.querySelector('.btn-del').onclick = () => delItem(item.id);
                list.appendChild(div);
            });

            if (sortableInstance) sortableInstance.destroy();
            const listContainer = document.getElementById('list');
            sortableInstance = new Sortable(listContainer, {
                animation: 150,
                handle: '.drag-handle',
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                onEnd: function (evt) { saveNewOrder(); }
            });
        });

        // --- MANIPULAÇÃO DINÂMICA DE OPÇÕES DA ENQUETE ---
        window.addPollOption = (value = '') => {
            const container = document.getElementById('pollOptionsContainer');
            const div = document.createElement('div');
            div.className = 'poll-row';
            div.innerHTML = `
                <input type="text" class="poll-input" placeholder="Nova opção..." value="${value}">
                <button class="btn-remove-opt" onclick="this.parentElement.remove()" title="Remover">×</button>
            `;
            container.appendChild(div);
        }

        async function saveNewOrder() {
            const items = [...document.querySelectorAll('.news-item')];
            const batch = writeBatch(db);
            const now = Date.now();
            items.forEach((div, index) => {
                const id = div.dataset.id;
                const newOrder = now - (index * 1000);
                const docRef = doc(db, "noticias", id);
                batch.update(docRef, { orderId: newOrder });
            });
            try { await batch.commit(); showToast("Ordem atualizada!", "success"); }
            catch (e) { console.error(e); showToast("Erro ao reordenar.", "error"); }
        }

        // --- SALVAR / EDITAR ---
        document.getElementById('saveBtn').onclick = async () => {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "Processando..."; btn.disabled = true;

            const id = document.getElementById('editId').value;
            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const image = document.getElementById('image').value.trim() || 'https://placehold.co/800x450/18181b/FFF?text=NerdGeek';
            const content = document.getElementById('content').value.trim();
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const sourceName = document.getElementById('sourceName').value.trim();
            const author = document.getElementById('authorName').value.trim() || 'Kauan Bryan';

            const pollQ = document.getElementById('pollQuestion').value.trim();

            // Coletar opções dinâmicas
            const optionInputs = document.querySelectorAll('.poll-input');
            let poll = null;

            if (pollQ && optionInputs.length > 0) {
                const options = [];
                let hasValidOption = false;

                optionInputs.forEach(input => {
                    if (input.value.trim() !== "") {
                        hasValidOption = true;
                        // Tenta preservar votos se estiver editando e o texto for igual
                        let existingVotes = 0;
                        if (currentEditingPoll && currentEditingPoll.options) {
                            const match = currentEditingPoll.options.find(o => o.text === input.value.trim());
                            if (match) existingVotes = match.votes;
                        }
                        options.push({ text: input.value.trim(), votes: existingVotes });
                    }
                });

                if (hasValidOption) {
                    poll = { question: pollQ, options: options };
                }
            }

            if (!title || !content) {
                showToast("Título e Conteúdo obrigatórios!", "error");
                btn.innerText = id ? "SALVAR ALTERAÇÕES" : "PUBLICAR NOTÍCIA";
                btn.disabled = false;
                return;
            }

            const now = new Date();
            const payload = { title, category, image, content, videoUrl, sourceName, author };
            if (poll) payload.poll = poll;
            else if (id) payload.poll = null; // Remove enquete se limpar os campos na edição

            try {
                if (id) {
                    payload.lastEdited = now.getTime();
                    await updateDoc(doc(db, "noticias", id), payload);
                    showToast("Notícia atualizada!");
                } else {
                    payload.dateDisplay = now.toLocaleDateString('pt-BR');
                    payload.dateParsed = now.getTime();
                    payload.orderId = now.getTime();
                    await addDoc(newsCollection, payload);
                    showToast("Notícia enviada!");
                }
                resetForm();
            } catch (error) { showToast("Erro: " + error.message, "error"); }

            btn.innerText = id ? "SALVAR ALTERAÇÕES" : "PUBLICAR NOTÍCIA"; btn.disabled = false;
        };

        window.editItem = (item) => {
            document.getElementById('editId').value = item.id;
            document.getElementById('title').value = item.title;
            document.getElementById('category').value = item.category;
            document.getElementById('image').value = item.image;
            document.getElementById('content').value = item.content;
            document.getElementById('videoUrl').value = item.videoUrl || '';
            document.getElementById('sourceName').value = item.sourceName || '';
            document.getElementById('authorName').value = item.author || 'Kauan Bryan';

            // Limpa container de opções
            const container = document.getElementById('pollOptionsContainer');
            container.innerHTML = '';

            if (item.poll) {
                currentEditingPoll = item.poll; // Salva para tentar manter os votos
                document.getElementById('pollQuestion').value = item.poll.question;
                item.poll.options.forEach(opt => {
                    addPollOption(opt.text);
                });
            } else {
                currentEditingPoll = null;
                document.getElementById('pollQuestion').value = '';
                addPollOption(); // Adiciona 2 vazias por padrão
                addPollOption();
            }

            document.getElementById('saveBtn').innerText = "SALVAR ALTERAÇÕES";
            document.getElementById('cancelBtn').style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.delItem = async (id) => {
            if (confirm("Apagar permanentemente?")) {
                try { await deleteDoc(doc(db, "noticias", id)); showToast("Item deletado.", "error"); }
                catch (e) { showToast("Erro ao deletar.", "error"); }
            }
        };

        document.getElementById('cancelBtn').onclick = resetForm;

        function resetForm() {
            document.querySelectorAll('input, textarea').forEach(el => el.value = '');
            document.getElementById('category').value = 'games';
            document.getElementById('editId').value = '';

            // Reseta opções da enquete para 2 campos vazios
            const container = document.getElementById('pollOptionsContainer');
            container.innerHTML = '';
            addPollOption();
            addPollOption();
            currentEditingPoll = null;

            document.getElementById('saveBtn').innerText = "PUBLICAR NOTÍCIA";
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = type === 'error' ? '#ef4444' : '#10b981';
            toast.innerHTML = `<span style="color:${type === 'error' ? '#ef4444' : '#10b981'}; font-size:1.2rem;">●</span> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // Inicializa com 2 opções vazias
        resetForm();
    </script>
</body>

</html>
