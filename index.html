<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NerdGeek | Portal Online</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        /* CSS IDÊNTICO AO ANTERIOR - MANTER VISUAL */
        :root {
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.5);
            --accent: #06b6d4;
            --bg-body: #09090b;
            --bg-card: #18181b;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --font-head: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
        }

        .header {
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-family: var(--font-head);
            font-size: 1.8rem;
            font-weight: 900;
            cursor: pointer;
            color: white;
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--primary);
        }

        .search-box {
            position: relative;
            max-width: 300px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: #27272a;
            border: 1px solid transparent;
            padding: 8px 15px 8px 35px;
            border-radius: 50px;
            color: white;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #71717a;
            font-size: 0.9rem;
        }

        .nav-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: none;
        }

        .nav-item {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            color: var(--text-muted);
            transition: 0.3s;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-item:hover,
        .nav-item.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            animation: fadeUp 0.5s ease backwards;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(139, 92, 246, 0.4);
        }

        .img-container {
            height: 180px;
            overflow: hidden;
            position: relative;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .card:hover .img-container img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .tag {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            align-self: flex-start;
        }

        .tag.games {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }

        .tag.marvel {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .tag.dc {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        .tag.filmes {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
        }

        .tag.series {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
        }

        .card h3 {
            font-family: var(--font-head);
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: white;
        }

        .meta {
            margin-top: auto;
            font-size: 0.8rem;
            color: #71717a;
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        #detailsView {
            display: none;
            padding-bottom: 80px;
            animation: fadeUp 0.4s ease;
        }

        .detail-hero-container {
            position: relative;
            width: 100%;
            height: 450px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .detail-hero {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80%;
            background: linear-gradient(to top, #09090b 10%, transparent);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
        }

        .article-title {
            font-family: var(--font-head);
            font-size: 3rem;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .content-wrapper {
            max-width: 800px;
            margin: 0 auto;
        }

        .article-body {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #d4d4d8;
            margin-bottom: 40px;
        }

        .article-body p {
            margin-bottom: 20px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin: 30px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .embed-poll {
            background: #131315;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin: 40px 0;
        }

        .poll-opt {
            background: #27272a;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.2s;
        }

        .poll-opt:hover {
            background: #333;
        }

        .poll-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(139, 92, 246, 0.4);
            z-index: 1;
            transition: width 0.6s;
        }

        .poll-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        .site-footer {
            background: #000;
            border-top: 1px solid var(--border);
            padding: 50px 0;
            text-align: center;
            margin-top: auto;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width: 768px) {
            .header-content {
                flex-direction: column;
            }

            .article-title {
                font-size: 2rem;
            }

            .detail-hero-container {
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="container header-content">
            <div class="logo" onclick="window.showHome()">NERD<span>GEEK</span></div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="searchInput" placeholder="Pesquisar notícias...">
            </div>
            <div class="nav-scroll">
                <div class="nav-item active" onclick="window.filterNews('all', this)">Recentes</div>
                <div class="nav-item" onclick="window.filterNews('games', this)">Games</div>
                <div class="nav-item" onclick="window.filterNews('marvel', this)">Marvel</div>
                <div class="nav-item" onclick="window.filterNews('dc', this)">DC</div>
                <div class="nav-item" onclick="window.filterNews('filmes', this)">Filmes</div>
                <div class="nav-item" onclick="window.filterNews('series', this)">Séries</div>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="feedView">
            <h2 id="pageTitle" style="font-family: var(--font-head); font-size: 2rem; margin: 40px 0 20px;">Destaques
            </h2>
            <div id="newsGrid" class="cards-grid">
                <div style="color:#666; font-size:1.1rem;">Carregando feed...</div>
            </div>
        </div>

        <div id="detailsView">
            <div style="margin: 20px 0;"><span onclick="window.showHome()"
                    style="cursor:pointer; color:var(--text-muted);">← Voltar ao Feed</span></div>
            <div class="detail-hero-container">
                <img id="detailImage" src="" class="detail-hero">
                <div class="hero-overlay">
                    <span id="detailCategory" class="tag" style="margin-bottom:15px;">Categoria</span>
                    <h1 id="detailTitle" class="article-title">Titulo</h1>
                    <div style="font-size:0.9rem; color:#ccc;">📅 <span id="detailDate">Data</span></div>
                </div>
            </div>
            <div class="content-wrapper">
                <div id="videoArea"></div>
                <div id="articleBody" class="article-body"></div>
                <div id="linkArea" style="text-align:center; margin-top:50px;"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="logo" style="margin-bottom: 10px; font-size: 1.5rem;">NERD<span>GEEK</span></div>
            <div style="color: #444; font-size: 0.8rem;">&copy; 2025 NerdGeek. Powered by Firebase.</div>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.21.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.21.0/firebase-firestore.js";

        // --- COLE SUA CONFIGURAÇÃO FIREBASE AQUI ---
        const firebaseConfig = {
            apiKey: "AIzaSyCCCKb6EZKESQNIpE_CNKu3G7iaFS2Ini4",
            authDomain: "nerdgeek-b2bd4.firebaseapp.com",
            projectId: "nerdgeek-b2bd4",
            storageBucket: "nerdgeek-b2bd4.firebasestorage.app",
            messagingSenderId: "826389603208",
            appId: "1:826389603208:web:5e2e353ad79a54b97a503d",
            measurementId: "G-NBE1GRGFTT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const newsCollection = collection(db, "noticias");

        let allNews = [];
        let currentFilter = 'all';
        let currentSearch = '';

        // Carregamento Inicial (Ouvinte em tempo real para atualizações automáticas)
        onSnapshot(query(newsCollection, orderBy("dateParsed", "desc")), (snapshot) => {
            allNews = [];
            snapshot.forEach(doc => allNews.push({ id: doc.id, ...doc.data() }));
            renderGrid();
        });

        function renderGrid() {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '';

            const filtered = allNews.filter(item => {
                const matchCat = currentFilter === 'all' || item.category === currentFilter;
                const matchSearch = item.title.toLowerCase().includes(currentSearch.toLowerCase());
                return matchCat && matchSearch;
            });

            // Atualiza Título
            const pageTitle = document.getElementById('pageTitle');
            if (currentSearch) pageTitle.innerHTML = `Busca: <span style="color:var(--primary)">"${currentSearch}"</span>`;
            else pageTitle.innerHTML = currentFilter === 'all' ? 'Destaques' : `Categoria: <span style="color:var(--primary)">${currentFilter.toUpperCase()}</span>`;

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:#666;">Nenhum conteúdo encontrado.</div>';
                return;
            }

            filtered.forEach((news, idx) => {
                const card = document.createElement('article');
                card.className = 'card';
                card.style.animationDelay = `${idx * 0.05}s`;

                // Imagem Fallback
                const img = news.image || 'https://placehold.co/800x450/222/FFF';

                card.innerHTML = `
                    <div class="img-container"><img src="${img}" alt="${news.title}" onerror="this.src='https://placehold.co/800x450/222/FFF'"></div>
                    <div class="card-content">
                        <span class="tag ${news.category}">${news.category}</span>
                        <h3>${news.title}</h3>
                        <div class="meta">
                            <span>${news.dateDisplay}</span>
                            ${news.poll ? '<span style="color:var(--accent); font-weight:600;">📊 Enquete</span>' : ''}
                        </div>
                    </div>
                `;
                card.onclick = () => openDetails(news.id);
                grid.appendChild(card);
            });
        }

        window.openDetails = (id) => {
            const news = allNews.find(n => n.id === id);
            if (!news) return;

            document.getElementById('feedView').style.display = 'none';
            document.getElementById('detailsView').style.display = 'block';

            // Preenche dados
            document.getElementById('detailTitle').innerText = news.title;
            document.getElementById('detailCategory').className = `tag ${news.category}`;
            document.getElementById('detailCategory').innerText = news.category;
            document.getElementById('detailDate').innerText = news.dateDisplay;
            document.getElementById('detailImage').src = news.image;

            // Vídeo
            const vidArea = document.getElementById('videoArea');
            vidArea.innerHTML = '';
            if (news.videoUrl) {
                let vidId = '';
                if (news.videoUrl.includes('v=')) vidId = news.videoUrl.split('v=')[1].split('&')[0];
                else if (news.videoUrl.includes('youtu.be/')) vidId = news.videoUrl.split('youtu.be/')[1];
                if (vidId) vidArea.innerHTML = `<div class="video-wrapper"><iframe src="https://www.youtube.com/embed/${vidId}" frameborder="0" allowfullscreen></iframe></div>`;
            }

            // Link Externo
            document.getElementById('linkArea').innerHTML = news.externalLink
                ? `<a href="${news.externalLink}" target="_blank" style="display:inline-block; background:var(--accent); color:#000; font-weight:bold; padding:12px 30px; border-radius:50px; text-decoration:none;">LER MATÉRIA ORIGINAL ↗</a>` : '';

            // Texto + Enquete
            const contentDiv = document.getElementById('articleBody');
            const paragraphs = news.content.split('\n').filter(p => p.trim() !== '');
            let html = '';
            const insertIdx = paragraphs.length > 2 ? Math.floor(paragraphs.length / 2) : paragraphs.length;

            paragraphs.forEach((p, i) => {
                html += `<p>${p}</p>`;
                if (i === insertIdx - 1 && news.poll) {
                    html += `<div id="poll-container">${generatePollHTML(news)}</div>`;
                }
            });
            // Fallback se texto for curto
            if (paragraphs.length <= 2 && news.poll && !html.includes('embed-poll')) {
                html += `<div id="poll-container">${generatePollHTML(news)}</div>`;
            }

            contentDiv.innerHTML = html;
            window.scrollTo(0, 0);
        };

        function generatePollHTML(news) {
            const total = news.poll.options.reduce((a, b) => a + b.votes, 0);
            const userVote = localStorage.getItem(`vote_${news.id}`); // Voto local apenas para UI

            let opts = '';
            news.poll.options.forEach((opt, idx) => {
                const percent = total === 0 ? 0 : Math.round((opt.votes / total) * 100);
                const isSel = userVote == idx ? 'selected' : '';
                const barStyle = userVote !== null ? `width:${percent}%` : 'width:0';
                const pctText = userVote !== null ? `<span>${percent}%</span>` : '';

                opts += `
                    <div class="poll-opt ${isSel}" onclick="window.submitVote('${news.id}', ${idx})">
                        <div class="poll-bar" style="${barStyle}"></div>
                        <div class="poll-content">
                            <span>${opt.text}</span>
                            ${pctText}
                        </div>
                    </div>
                `;
            });

            return `
                <div class="embed-poll">
                    <div style="font-size:1.3rem; margin-bottom:20px; color:white;">📊 ${news.poll.question}</div>
                    <div>${opts}</div>
                    <div style="text-align:right; font-size:0.75rem; color:#666; margin-top:10px;">${total} votos</div>
                </div>
            `;
        }

        // Função de Voto (Realtime + Persistência)
        window.submitVote = async (id, optIdx) => {
            const hasVoted = localStorage.getItem(`vote_${id}`);
            if (hasVoted !== null) return; // Simples bloqueio de voto duplicado no mesmo browser

            const news = allNews.find(n => n.id === id);
            if (!news) return;

            // Atualiza Objeto Local
            news.poll.options[optIdx].votes++;

            // Salva no Firestore
            try {
                const docRef = doc(db, "noticias", id);
                await updateDoc(docRef, {
                    poll: news.poll
                });
                localStorage.setItem(`vote_${id}`, optIdx);

                // Atualiza UI (O listener onSnapshot faria isso, mas aqui damos feedback imediato)
                const container = document.getElementById('poll-container');
                if (container) container.innerHTML = generatePollHTML(news);

            } catch (e) {
                console.error("Erro ao votar:", e);
                alert("Erro ao computar voto.");
            }
        };

        // Filtros e Navegação
        window.filterNews = (cat, el) => {
            currentFilter = cat;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if (el) el.classList.add('active');
            window.showHome();
        };

        window.showHome = () => {
            document.getElementById('detailsView').style.display = 'none';
            document.getElementById('feedView').style.display = 'block';
            renderGrid();
        };

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearch = e.target.value; renderGrid();
        });
    </script>
</body>

</html>
