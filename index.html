<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NerdGeek | Seu Portal de Notícias</title>
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nerdgeek.netlify.app/">
    <meta property="og:title" content="NerdGeek | Seu Portal de Notícias">
    <meta property="og:description"
        content="Notícias diárias sobre Marvel, DC, Games, Filmes e Séries. Acompanhe tudo em um só lugar!">
    <meta property="og:image" content="https://nerdgeek.netlify.app/nerd-geek-icon.png">
    <meta name="theme-color" content="#8b5cf6">

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.5);
            --accent: #06b6d4;
            --bg-body: #09090b;
            --bg-card: #18181b;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --font-head: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex-grow: 1;
        }

        /* --- HEADER & NAV --- */
        .header {
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-family: var(--font-head);
            font-size: 1.8rem;
            font-weight: 900;
            cursor: pointer;
            color: white;
            letter-spacing: -1px;
            white-space: nowrap;
        }

        .logo span {
            color: var(--primary);
        }

        .search-box {
            position: relative;
            max-width: 300px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: #27272a;
            border: 1px solid transparent;
            padding: 8px 15px 8px 35px;
            border-radius: 50px;
            color: white;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #71717a;
            font-size: 0.9rem;
        }

        /* ÍCONE DE NOTIFICAÇÃO (SINO) */
        .notify-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            position: relative;
            font-size: 1.2rem;

            /* Garante o formato redondo mesmo em telas apertadas */
            flex-shrink: 0;
            min-width: 40px;
        }

        .notify-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* ESTADO ATIVO (VERDE) */
        .notify-btn.active {
            color: #4ade80;
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .notify-btn.active::after {
            content: '';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            border: 2px solid var(--bg-body);
            box-shadow: 0 0 5px #4ade80;
        }

        /* ESTADO SILENCIADO (VERMELHO) */
        .notify-btn.muted {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.3);
        }

        .nav-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: none;
        }

        .nav-item {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            color: var(--text-muted);
            transition: 0.3s;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-item:hover,
        .nav-item.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* --- CARDS & GRID --- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            animation: fadeUp 0.5s ease backwards;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 10px 30px -10px rgba(139, 92, 246, 0.2);
        }

        .img-container {
            height: 180px;
            overflow: hidden;
            position: relative;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .card:hover .img-container img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .tag {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            align-self: flex-start;
        }

        .tag.games {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }

        .tag.marvel {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .tag.dc {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        .tag.filmes {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
        }

        .tag.series {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
        }

        .card h3 {
            font-family: var(--font-head);
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: white;
            line-height: 1.3;
        }

        .meta {
            margin-top: auto;
            font-size: 0.8rem;
            color: #71717a;
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* --- PAGINATION --- */
        .pagination-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 60px;
            flex-wrap: wrap;
        }

        .page-btn {
            background: #27272a;
            border: 1px solid var(--border);
            color: #a1a1aa;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-btn:hover,
        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* --- DETAILS VIEW --- */
        #detailsView {
            display: none;
            padding-bottom: 80px;
            animation: fadeUp 0.4s ease;
        }

        .detail-hero-container {
            position: relative;
            width: 100%;
            height: 450px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .detail-hero {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80%;
            background: linear-gradient(to top, #09090b 10%, transparent);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
        }

        .article-title {
            font-family: var(--font-head);
            font-size: 3rem;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .content-wrapper {
            max-width: 800px;
            margin: 0 auto;
        }

        .article-body {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #d4d4d8;
            margin-bottom: 40px;
        }

        .article-body p {
            margin-bottom: 20px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin: 30px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* --- POLLS --- */
        .embed-poll {
            background: #131315;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin: 40px 0;
        }

        .poll-opt {
            background: #27272a;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.2s;
        }

        .poll-opt:hover {
            background: #333;
        }

        .poll-opt.selected {
            border: 1px solid var(--primary);
            background: rgba(139, 92, 246, 0.1);
        }

        .poll-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(139, 92, 246, 0.4);
            z-index: 1;
            transition: width 0.6s;
        }

        .poll-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        /* --- TOAST --- */
        #notify-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none;
        }

        .news-toast {
            background: rgba(24, 24, 27, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            padding: 16px 20px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 15px;
            transform: translateX(100px);
            opacity: 0;
            animation: slideInToast 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            max-width: 350px;
            cursor: pointer;
            pointer-events: auto;
        }

        .news-toast:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(139, 92, 246, 0.2);
        }

        .toast-icon {
            font-size: 1.5rem;
            background: rgba(139, 92, 246, 0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast-content h4 {
            font-size: 0.9rem;
            color: var(--primary);
            margin-bottom: 2px;
        }

        .toast-content p {
            font-size: 0.85rem;
            color: #ccc;
            margin: 0;
            line-height: 1.3;
        }

        @keyframes slideInToast {
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* --- FOOTER --- */
        .site-footer {
            background: #000;
            border-top: 1px solid var(--border);
            padding: 50px 0;
            text-align: center;
            margin-top: auto;
        }

        .socials {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        .social-link {
            width: 40px;
            height: 40px;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            fill: white;
        }

        .social-link:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        .social-link svg {
            width: 20px;
            height: 20px;
        }

        .author-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #ccc;
            margin-top: 5px;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }

        ::-webkit-scrollbar-thumb {
            background-color: #3f3f46;
            border-radius: 5px;
            border: 2px solid var(--bg-body);
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: var(--primary);
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--bg-body);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- CSS RESPONSIVO (CORRIGIDO) --- */
        @media(max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }

            .search-box {
                /* A caixa de pesquisa agora ocupa o espaço restante */
                flex-grow: 1;
                max-width: none;
            }

            .notify-btn {
                /* Garante o formato redondo e o tamanho fixo no celular */
                min-width: 40px;
                flex-shrink: 0;
            }

            .article-title {
                font-size: 2rem;
            }

            .detail-hero-container {
                height: 300px;
            }

            .nav-scroll {
                width: 100%;
            }

            #notify-container {
                left: 20px;
                right: 20px;
                bottom: 20px;
                align-items: center;
            }

            .news-toast {
                width: 100%;
                max-width: none;
            }
        }
    </style>
</head>

        </div>

            <div class="content-wrapper">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.21.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.21.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCCKb6EZKESQNIpE_CNKu3G7iaFS2Ini4",
            authDomain: "nerdgeek-b2bd4.firebaseapp.com",
            projectId: "nerdgeek-b2bd4",
            storageBucket: "nerdgeek-b2bd4.firebasestorage.app",
            messagingSenderId: "826389603208",
            appId: "1:826389603208:web:5e2e353ad79a54b97a503d",
            measurementId: "G-NBE1GRGFTT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const newsCollection = collection(db, "noticias");

        const ITEMS_PER_PAGE = 6;
        let allNews = [];
        let currentFilter = 'all';
        let currentSearch = '';
        let currentPage = 1;
        let isFirstLoad = true;

        // --- SISTEMA DE NOTIFICAÇÃO ON/OFF ---

        // Verifica se o usuário silenciou manualmente
        let isMuted = localStorage.getItem('nerdgeek_muted') === 'true';

        window.toggleNotifications = () => {
            const btn = document.getElementById('notifyBtn');

            // 1. Se o navegador não suporta ou negou
            if (!("Notification" in window)) {
                alert("Navegador sem suporte."); return;
            }
            if (Notification.permission === "denied") {
                alert("As notificações estão bloqueadas no seu navegador. Você precisa desbloquear nas configurações do site (cadeado na barra de endereço).");
                return;
            }

            // 2. Se ainda não pediu permissão, pede agora
            if (Notification.permission === "default") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        isMuted = false;
                        localStorage.setItem('nerdgeek_muted', 'false');
                        new Notification("NerdGeek", { body: "Notificações ativadas! 🔔", icon: "favicon.png" });
                        updateBellIcon();
                    }
                });
                return;
            }

            // 3. Se já tem permissão: Lógica de Ligar/Desligar (Mute)
            if (Notification.permission === "granted") {
                if (isMuted) {
                    // Estava mudo, vamos ligar
                    isMuted = false;
                    localStorage.setItem('nerdgeek_muted', 'false');
                    // Feedback visual rápido (Toast pequeno)
                    showToastSystem("Notificações Ativadas", "success");
                } else {
                    // Estava ligado, pergunta se quer desligar
                    if (confirm("Deseja silenciar as notificações de novas notícias?")) {
                        isMuted = true;
                        localStorage.setItem('nerdgeek_muted', 'true');
                        showToastSystem("Notificações Silenciadas", "error");
                    }
                }
                updateBellIcon();
            }
        }

        function updateBellIcon() {
            const btn = document.getElementById('notifyBtn');
            btn.className = 'notify-btn'; // Reseta classes

            if (Notification.permission === 'granted') {
                if (isMuted) {
                    btn.classList.add('muted');
                    btn.innerText = '🔕';
                    btn.title = "Notificações Silenciadas (Clique para ativar)";
                } else {
                    btn.classList.add('active');
                    btn.innerText = '🔔';
                    btn.title = "Notificações Ativas (Clique para silenciar)";
                }
            } else {
                btn.innerText = '🔔';
                btn.title = "Ativar Notificações";
            }
        }

        // Função auxiliar só para feedback da ação do botão
        function showToastSystem(msg, type) {
            const container = document.getElementById('notify-container');
            const toast = document.createElement('div');
            toast.className = 'news-toast';
            toast.style.borderLeftColor = type === 'success' ? '#4ade80' : '#f87171';
            toast.innerHTML = `<div class="toast-content" style="padding:0;"><h4 style="margin:0; color:${type === 'success' ? '#4ade80' : '#f87171'}">${msg}</h4></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // Inicializa ícone ao carregar
        updateBellIcon();

        // --- LISTENER (RECEBE AS NOTÍCIAS) ---
        onSnapshot(query(newsCollection, orderBy("orderId", "desc")), (snapshot) => {
            if (!isFirstLoad) {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        // SÓ MOSTRA SE NÃO ESTIVER MUTADO!
                        if (!isMuted) {
                            showNotification(change.doc.data());
                        } else {
                            console.log("Notícia recebida, mas usuário silenciou.");
                        }
                    }
                });
            }
            allNews = [];
            snapshot.forEach(doc => allNews.push({ id: doc.id, ...doc.data() }));
            renderGrid();
            isFirstLoad = false;
        });

        // --- DISPARO DE NOTIFICAÇÃO ---
        function showNotification(news) {
            // Toast Visual
            const container = document.getElementById('notify-container');
            const toast = document.createElement('div');
            toast.className = 'news-toast';
            toast.innerHTML = `
                <div class="toast-icon">🚀</div>
                <div class="toast-content">
                    <h4>Nova publicação!</h4>
                    <p>${news.title.substring(0, 45)}...</p>
                </div>
            `;

            const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3');
            audio.volume = 0.4;
            audio.play().catch(e => { }); // Ignora erro de autoplay

            toast.onclick = () => { window.scrollTo({ top: 0, behavior: 'smooth' }); toast.remove(); };
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 6000);

            // Notificação Nativa (Windows/Android)
            if (Notification.permission === "granted") {
                const notif = new Notification(`NerdGeek: ${news.category.toUpperCase()}`, {
                    body: news.title,
                    icon: news.image || 'favicon.png',
                    tag: news.id
                });
                notif.onclick = function () {
                    window.focus();
                    window.openDetails(news.id);
                    this.close();
                };
            }
        }

        function renderGrid() {
            const grid = document.getElementById('newsGrid');
            const paginationDiv = document.getElementById('pagination');

            const filtered = allNews.filter(item => {
                const matchCat = currentFilter === 'all' || item.category === currentFilter;
                const matchSearch = item.title.toLowerCase().includes(currentSearch.toLowerCase());
                return matchCat && matchSearch;
            });

            const pageTitle = document.getElementById('pageTitle');
            if (currentSearch) pageTitle.innerHTML = `Busca: <span style="color:var(--primary)">"${currentSearch}"</span>`;
            else pageTitle.innerHTML = currentFilter === 'all' ? 'Destaques' : `Categoria: <span style="color:var(--primary)">${currentFilter.toUpperCase()}</span>`;

            grid.innerHTML = '';
            paginationDiv.innerHTML = '';

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:#666;">Nenhum conteúdo encontrado.</div>';
                return;
            }

            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
            if (currentPage > totalPages) currentPage = 1;

            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pagedNews = filtered.slice(start, end);

            pagedNews.forEach((news, idx) => {
                const card = document.createElement('article');
                card.className = 'card';
                card.style.animationDelay = `${idx * 0.05}s`;
                const img = news.image || 'https://placehold.co/800x450/222/FFF';
                card.innerHTML = `
                    <div class="img-container"><img src="${img}" alt="${news.title}" onerror="this.src='https://placehold.co/800x450/222/FFF'"></div>
                    <div class="card-content">
                        <span class="tag ${news.category}">${news.category}</span>
                        <h3>${news.title}</h3>
                        <div class="meta"><span>${news.dateDisplay}</span>${news.poll ? '<span style="color:var(--accent); font-weight:600;">📊 Enquete</span>' : ''}</div>
                    </div>
                `;
                card.onclick = () => openDetails(news.id);
                grid.appendChild(card);
            });

            if (totalPages > 1) {
                for (let i = 1; i <= totalPages; i++) {
                    const btn = document.createElement('button');
                    btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                    btn.innerText = i;
                    btn.onclick = () => { currentPage = i; renderGrid(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
                    paginationDiv.appendChild(btn);
                }
            }
        }

        window.openDetails = (id) => {
            const news = allNews.find(n => n.id === id);
            if (!news) return;

            document.getElementById('feedView').style.display = 'none';
            document.getElementById('detailsView').style.display = 'block';

            document.getElementById('detailTitle').innerText = news.title;
            document.getElementById('detailCategory').className = `tag ${news.category}`;
            document.getElementById('detailCategory').innerText = news.category;
            document.getElementById('detailDate').innerText = news.dateDisplay;
            document.getElementById('detailAuthor').innerText = news.author || 'Kauan Bryan';

            const editSpan = document.getElementById('detailEdited');
            if (news.lastEdited) {
                const editDate = new Date(news.lastEdited).toLocaleDateString('pt-BR');
                editSpan.innerText = `(Editado em ${editDate})`;
                editSpan.style.display = 'inline';
            } else {
                editSpan.style.display = 'none';
            }

            document.getElementById('detailImage').src = news.image;

            const vidArea = document.getElementById('videoArea');
            vidArea.innerHTML = '';

            if (news.videoUrl) {
                const isYouTube = news.videoUrl.includes('youtube.com') || news.videoUrl.includes('youtu.be');
                if (isYouTube) {
                    let vidId = '';
                    if (news.videoUrl.includes('v=')) vidId = news.videoUrl.split('v=')[1].split('&')[0];
                    else if (news.videoUrl.includes('youtu.be/')) vidId = news.videoUrl.split('youtu.be/')[1];

                    if (vidId) {
                        vidArea.innerHTML = `<div class="video-wrapper"><iframe src="https://www.youtube.com/embed/${vidId}" frameborder="0" allowfullscreen></iframe></div>`;
                    }
                } else {
                    vidArea.innerHTML = `
                        <div class="video-wrapper" style="padding-bottom: 0; height: auto;">
                            <video controls style="width: 100%; border-radius: 12px; display: block;">
                                <source src="${news.videoUrl}" type="video/mp4">
                                <source src="${news.videoUrl}" type="video/quicktime">
                                Seu navegador não suporta este formato de vídeo.
                            </video>
                        </div>`;
                }
            }

            document.getElementById('sourceArea').innerHTML = news.sourceName ? `<strong>Fonte:</strong> ${news.sourceName}` : '';

            const contentDiv = document.getElementById('articleBody');
            const paragraphs = news.content.split('\n').filter(p => p.trim() !== '');
            let html = '';
            const insertIdx = paragraphs.length > 2 ? Math.floor(paragraphs.length / 2) : paragraphs.length;

            paragraphs.forEach((p, i) => {
                html += `<p>${p}</p>`;
                if (i === insertIdx - 1 && news.poll) { html += `<div id="poll-container">${generatePollHTML(news)}</div>`; }
            });
            if (paragraphs.length <= 2 && news.poll && !html.includes('embed-poll')) { html += `<div id="poll-container">${generatePollHTML(news)}</div>`; }
            contentDiv.innerHTML = html;
            window.scrollTo(0, 0);
        };

        function generatePollHTML(news) {
            const total = news.poll.options.reduce((a, b) => a + b.votes, 0);
            const userVote = localStorage.getItem(`vote_${news.id}`);
            let opts = '';
            news.poll.options.forEach((opt, idx) => {
                const percent = total === 0 ? 0 : Math.round((opt.votes / total) * 100);
                const isSel = userVote == idx ? 'selected' : '';
                const barStyle = userVote !== null ? `width:${percent}%` : 'width:0';
                const pctText = userVote !== null ? `<span>${percent}%</span>` : '';
                opts += `<div class="poll-opt ${isSel}" onclick="window.submitVote('${news.id}', ${idx})"><div class="poll-bar" style="${barStyle}"></div><div class="poll-content"><span>${opt.text}</span>${pctText}</div></div>`;
            });
            return `<div class="embed-poll"><div style="font-size:1.3rem; margin-bottom:20px; color:white;">📊 ${news.poll.question}</div><div>${opts}</div><div style="text-align:right; font-size:0.75rem; color:#666; margin-top:10px;">${total} votos</div></div>`;
        }

        window.submitVote = async (id, newOptIdx) => {
            const news = allNews.find(n => n.id === id);
            if (!news) return;

            const savedVoteStr = localStorage.getItem(`vote_${id}`);
            const oldOptIdx = savedVoteStr !== null ? parseInt(savedVoteStr) : null;

            try {
                if (oldOptIdx === newOptIdx) {
                    news.poll.options[oldOptIdx].votes--;
                    if (news.poll.options[oldOptIdx].votes < 0) news.poll.options[oldOptIdx].votes = 0;
                    localStorage.removeItem(`vote_${id}`);
                }
                else if (oldOptIdx !== null) {
                    news.poll.options[oldOptIdx].votes--;
                    if (news.poll.options[oldOptIdx].votes < 0) news.poll.options[oldOptIdx].votes = 0;
                    news.poll.options[newOptIdx].votes++;
                    localStorage.setItem(`vote_${id}`, newOptIdx);
                }
                else {
                    news.poll.options[newOptIdx].votes++;
                    localStorage.setItem(`vote_${id}`, newOptIdx);
                }

                const docRef = doc(db, "noticias", id);
                await updateDoc(docRef, { poll: news.poll });

                const container = document.getElementById('poll-container');
                if (container) container.innerHTML = generatePollHTML(news);

            } catch (e) { console.error("Erro ao votar:", e); alert("Erro ao computar voto."); }
        };

        window.filterNews = (cat, el) => {
            currentFilter = cat;
            currentPage = 1;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if (el) el.classList.add('active');
            window.showHome();
        };

        window.showHome = () => {
            document.getElementById('detailsView').style.display = 'none';
            document.getElementById('feedView').style.display = 'block';
            renderGrid();
        };

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            currentPage = 1;
            renderGrid();
        });
    </script>
